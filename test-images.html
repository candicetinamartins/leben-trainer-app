<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Test - Leben in Deutschland</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .section-title {
            font-size: 1.8em;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .question-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-id {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .image-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .image-exists {
            background: #28a745;
            color: white;
        }

        .image-missing {
            background: #dc3545;
            color: white;
        }

        .question-text {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .question-text-en {
            font-size: 0.95em;
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
        }

        .answers-list {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 2px solid #e0e0e0;
        }

        .answer-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .answer-correct {
            background: #d4edda;
            border-left: 4px solid #28a745;
            font-weight: bold;
        }

        .answer-incorrect {
            background: #f8f9fa;
            border-left: 4px solid #ddd;
        }

        .answer-label {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .answer-correct .answer-label {
            background: #28a745;
        }

        .answer-text {
            flex: 1;
        }

        .correct-badge {
            background: #28a745;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
        }

        .image-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .image-path {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #666;
            margin-top: 10px;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 5px;
        }

        .error-message {
            color: #dc3545;
            font-weight: bold;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Image Test - Leben in Deutschland</h1>
        
        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalQuestions">0</div>
                <div class="stat-label">Total Questions with Images</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="generalQuestions">0</div>
                <div class="stat-label">General Questions</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="stateQuestions">0</div>
                <div class="stat-label">State Questions</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="imagesLoaded">0</div>
                <div class="stat-label">Images Loaded</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">📚 General Questions</div>
            <div id="generalQuestionsContainer"></div>
        </div>

        <div class="section">
            <div class="section-title">🏛️ State Questions</div>
            <div id="stateQuestionsContainer"></div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script>
        let imagesLoadedCount = 0;

        function createQuestionCard(question, type) {
            const card = document.createElement('div');
            card.className = 'question-card';

            const header = document.createElement('div');
            header.className = 'question-header';

            const idBadge = document.createElement('span');
            idBadge.className = 'question-id';
            idBadge.textContent = `Q${question.id}`;

            const statusBadge = document.createElement('span');
            statusBadge.className = 'image-status';
            statusBadge.textContent = 'Checking...';

            header.appendChild(idBadge);
            header.appendChild(statusBadge);

            const questionTextDe = document.createElement('div');
            questionTextDe.className = 'question-text';
            questionTextDe.textContent = question.questionDe;

            const questionTextEn = document.createElement('div');
            questionTextEn.className = 'question-text-en';
            questionTextEn.textContent = question.questionEn;

            // Create answers section
            const answersSection = document.createElement('div');
            answersSection.className = 'answers-list';
            
            const answersTitle = document.createElement('div');
            answersTitle.style.fontWeight = 'bold';
            answersTitle.style.marginBottom = '10px';
            answersTitle.style.color = '#667eea';
            answersTitle.textContent = '📝 Answer Options:';
            answersSection.appendChild(answersTitle);

            question.answers.forEach((answer, idx) => {
                const answerItem = document.createElement('div');
                answerItem.className = `answer-item ${answer.correct ? 'answer-correct' : 'answer-incorrect'}`;
                
                const label = document.createElement('div');
                label.className = 'answer-label';
                label.textContent = String.fromCharCode(65 + idx);
                
                const text = document.createElement('div');
                text.className = 'answer-text';
                text.innerHTML = `
                    <div>${answer.text}</div>
                    <div style="font-size: 0.85em; color: #666; font-style: italic; margin-top: 3px;">${answer.textEn}</div>
                `;
                
                answerItem.appendChild(label);
                answerItem.appendChild(text);
                
                if (answer.correct) {
                    const badge = document.createElement('span');
                    badge.className = 'correct-badge';
                    badge.textContent = '✓ CORRECT';
                    answerItem.appendChild(badge);
                }
                
                answersSection.appendChild(answerItem);
            });

            const imageContainer = document.createElement('div');
            imageContainer.className = 'image-container';

            // Handle multiple images (images array) or single image
            const imagesList = question.images || (question.image ? [question.image] : []);
            let loadedCount = 0;
            let totalImages = imagesList.length;

            if (imagesList.length > 1) {
                // Multiple images - display side by side with Bild labels
                const imagesWrapper = document.createElement('div');
                imagesWrapper.style.cssText = 'display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 10px;';
                
                imagesList.forEach((imgSrc, idx) => {
                    const imgDiv = document.createElement('div');
                    imgDiv.style.cssText = 'display: flex; flex-direction: column; align-items: center;';
                    
                    const img = document.createElement('img');
                    img.src = imgSrc;
                    img.alt = `Bild ${idx + 1}`;
                    img.style.cssText = 'height: 100px; width: auto; object-fit: contain; border: 1px solid #ddd; border-radius: 4px;';
                    
                    img.onload = () => {
                        loadedCount++;
                        if (loadedCount === totalImages) {
                            statusBadge.className = 'image-status image-exists';
                            statusBadge.textContent = `✓ ${totalImages} Images Loaded`;
                            imagesLoadedCount++;
                            updateStats();
                        }
                    };
                    img.onerror = () => {
                        statusBadge.className = 'image-status image-missing';
                        statusBadge.textContent = '✗ Some Images Missing';
                    };
                    
                    const label = document.createElement('span');
                    label.style.cssText = 'margin-top: 5px; font-weight: bold; font-size: 0.9em;';
                    label.textContent = `Bild ${idx + 1}`;
                    
                    imgDiv.appendChild(img);
                    imgDiv.appendChild(label);
                    imagesWrapper.appendChild(imgDiv);
                });
                
                imageContainer.appendChild(imagesWrapper);
            } else if (imagesList.length === 1) {
                // Single image
                const img = document.createElement('img');
                img.src = imagesList[0];
                img.alt = `Question ${question.id}`;
                
                img.onload = () => {
                    statusBadge.className = 'image-status image-exists';
                    statusBadge.textContent = '✓ Image Loaded';
                    imagesLoadedCount++;
                    updateStats();
                };
                img.onerror = () => {
                    statusBadge.className = 'image-status image-missing';
                    statusBadge.textContent = '✗ Image Missing';
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'error-message';
                    errorMsg.textContent = '⚠️ Image file not found!';
                    imageContainer.appendChild(errorMsg);
                };
                
                imageContainer.appendChild(img);
            }

            // Show image path(s)
            const imagePath = document.createElement('div');
            imagePath.className = 'image-path';
            imagePath.textContent = `📁 ${imagesList.join(', ')}`;
            imageContainer.appendChild(imagePath);

            // Show copyright if present
            if (question.copyright) {
                const copyrightDiv = document.createElement('div');
                copyrightDiv.style.cssText = 'font-size: 0.8em; color: #666; margin-top: 5px; text-align: center;';
                copyrightDiv.textContent = question.copyright;
                imageContainer.appendChild(copyrightDiv);
            }

            card.appendChild(header);
            card.appendChild(questionTextDe);
            card.appendChild(questionTextEn);
            card.appendChild(answersSection);
            card.appendChild(imageContainer);

            return card;
        }

        function loadQuestions() {
            const generalContainer = document.getElementById('generalQuestionsContainer');
            const stateContainer = document.getElementById('stateQuestionsContainer');

            let generalCount = 0;
            let stateCount = 0;

            // Load general questions with images (check for both image and images fields)
            GENERAL_QUESTIONS.forEach(question => {
                if (question.image || question.images) {
                    const card = createQuestionCard(question, 'general');
                    generalContainer.appendChild(card);
                    generalCount++;
                }
            });

            // Load state questions with images (check for both image and images fields)
            Object.keys(STATE_QUESTIONS).forEach(state => {
                STATE_QUESTIONS[state].forEach(question => {
                    if (question.image || question.images) {
                        const card = createQuestionCard(question, 'state');
                        stateContainer.appendChild(card);
                        stateCount++;
                    }
                });
            });

            // Update stats
            document.getElementById('totalQuestions').textContent = generalCount + stateCount;
            document.getElementById('generalQuestions').textContent = generalCount;
            document.getElementById('stateQuestions').textContent = stateCount;

            if (generalCount === 0) {
                generalContainer.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">No general questions with images found.</p>';
            }

            if (stateCount === 0) {
                stateContainer.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">No state questions with images found.</p>';
            }
        }

        function updateStats() {
            document.getElementById('imagesLoaded').textContent = imagesLoadedCount;
        }

        // Load questions when page loads
        window.addEventListener('DOMContentLoaded', loadQuestions);
    </script>
</body>
</html>
